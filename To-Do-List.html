<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML To-Do List</title>
</head>
<body>

    <h1>Khanak's To-Do List</h1>
    <p></p>

    <hr>

    <!-- Group 1: Work Tasks -->
    <details open>
        <summary><strong>💼 Work Tasks</strong></summary>
        <p>
            <label>
                <input type="checkbox"> Finish the weekly project report
            </label>
        </p>
        <p>
            <label>
                <input type="checkbox"> Reply to whatsapp messages
            </label>
        </p>
        <p>
            <label>
                <input type="checkbox"> Prepare presentation slides
            </label>
        </p>
    </details>

    <br>

    <!-- Group 2: Personal Tasks -->
    <details open>
        <summary><strong>🏠 Personal Tasks</strong></summary>
        <p>
            <label>
                <input type="checkbox" checked> Buy essentials (coffee,milk,biscuits)
            </label>
        </p>
        <p>
            <label>
                <input type="checkbox"> Hit the gym at 6 PM
            </label>
        </p>
        <p>
            <label>
                <input type="checkbox"> Call mom
            </label>
        </p>
    </details>

</body>
</html>
